name: Check links

# Checks every link in the built page and the docs. Runs on pull requests
# (against a freshly built index.html, so new source links are checked) and
# once a week, so link rot in older rows is caught too. A failed weekly run
# is the alert: fix or replace the link, or add the host to .lychee.toml
# with a comment saying why it cannot be checked automatically.
on:
  pull_request:
    paths:
      - "data/**"
      - "template.html"
      - "README.md"
      - "PRIVACY.md"
      - "build.py"
      - ".lychee.toml"
  schedule:
    - cron: "0 9 * * 0" # Sundays, 09:00 UTC
  workflow_dispatch: {}

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page
        run: python3 build.py
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --config .lychee.toml index.html README.md PRIVACY.md
          fail: true

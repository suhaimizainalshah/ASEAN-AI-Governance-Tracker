name: Check links

# Checks every link in the built page and the docs. Runs on pull requests
# (against a freshly built index.html, so new source links are checked) and
# once a week, so link rot in older rows is caught too. A failed weekly run
# is the alert: fix or replace the link, or add the host to .lychee.toml
# with a comment saying why it cannot be checked automatically.
on:
  pull_request:
    paths:
      - "data/**"
      - "template.html"
      - "README.md"
      - "PRIVACY.md"
      - "build.py"
      - ".lychee.toml"
  schedule:
    - cron: "0 9 * * 0" # Sundays, 09:00 UTC
  workflow_dispatch: {}

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page
        run: python3 build.py
      - name: Lay out the site as it is served, at aibenar.dev/<repository>/
        # The pages link to sister sites with short addresses such as / and /EU-AI-Governance-Tracker/.
        # Checking local files, the link checker needs a root folder shaped like the live site to resolve them.
        # This repository goes in its real folder; the sister sites get placeholders, since each is checked
        # by its own repository's link check.
        run: |
          S="$RUNNER_TEMP/site"; mkdir -p "$S"
          cp -r "$GITHUB_WORKSPACE" "$S/${GITHUB_REPOSITORY#*/}"
          for p in "" AI-Benar-Advisory ASEAN-AI-Governance-Tracker EU-AI-Governance-Tracker little-light-lit if-leaves-weave brain-boost-timer ai-asli/classroom; do
            mkdir -p "$S/$p"; [ -f "$S/$p/index.html" ] || echo '<!doctype html><title>Sister site, checked by its own repository</title>' > "$S/$p/index.html"
          done
          echo "SITE_ROOT=$S" >> "$GITHUB_ENV"
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --root-dir ${{ env.SITE_ROOT }} --config .lychee.toml index.html README.md PRIVACY.md
          fail: true
